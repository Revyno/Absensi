name: hris_mobile
description: "NUSATEK HRIS — employee mobile app (Flutter), backend hris-backend."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  mobile_scanner: ^5.2.3
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
